name: RaK development validation

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rak-development-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact development commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight isolated build policy and measured thirteen-point roadmap
        run: node --test tools/vercel-build-policy.test.mjs tools/development-deploy-gate.test.mjs tools/build-architecture-contract.test.mjs tools/roadmap-contract.test.mjs tools/canonical-source-snapshot.test.mjs tools/canonical-build-contract.test.mjs tools/canonical-baseline-smoke.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and run npm check and critical smoke twice
        run: |
          npm run vercel-build
          npm run vercel-build
      # Exact historical version tests run in stages on BOTH builds before their next bump.
      # node --test tools/release-gate-17043.test.mjs
      # node --test tools/release-gate-17044.test.mjs
      # node --test tools/release-gate-17045.test.mjs
      # node --test tools/release-gate-17046.test.mjs
      # node --test tools/release-gate-17047.test.mjs
      # node --test tools/release-gate-17048.test.mjs
      # node --test tools/release-gate-17049.test.mjs
      # node --test tools/release-gate-17050.test.mjs
      # node --test tools/release-gate-17051.test.mjs
      # node --test tools/release-gate-17052.test.mjs
      # node --test tools/release-gate-17053.test.mjs
      # node --test tools/release-gate-17054.test.mjs
      # node --test tools/release-gate-17055.test.mjs
      # node --test tools/release-gate-17056.test.mjs
      # node --test tools/release-gate-17057.test.mjs
      # node --test tools/release-gate-17058.test.mjs
      # node --test tools/release-gate-17059.test.mjs
      # node --test tools/release-gate-17060.test.mjs
      # node --test tools/release-gate-17061.test.mjs
      # node --test tools/release-gate-17062.test.mjs
      # node --test tools/release-gate-17063.test.mjs
      # node --test tools/release-gate-17064.test.mjs
      # node --test tools/release-gate-17065.test.mjs
      # node --test tools/release-gate-17066.test.mjs
      - name: Verify final release and inherited quality gates
        working-directory: .rak-canonical-build/work
        run: |
          node --test tools/release-gate-17039.test.mjs
          node --test tools/rotation-release-gate-17040.test.mjs
          node --test tools/two-pass-release-17041.test.mjs
          node --test tools/release-gate-17067.test.mjs
          node --test tools/release-gate-17068.test.mjs
          node --test tools/release-gate-17069.test.mjs
      - name: Verify non-destructive rollback contract and measured PWA budgets
        working-directory: .rak-canonical-build/work
        run: |
          node --check tools/preview-rollback-preflight-17068.mjs
          node --check tools/pwa-start-bench-17068.mjs
          node --test tools/preview-rollback-preflight-17068.test.mjs
          node --test tools/pwa-start-bench-17068.test.mjs
      - name: Verify source backup ZIP inventory, excluded files and CRC
        working-directory: .rak-canonical-build/work
        run: node tools/backup-source-integrity-17051.mjs
      - name: Real Chromium mobile start, offline restart and online recovery
        working-directory: .rak-canonical-build/work
        run: |
          node --test tools/pwa-offline-17052.test.mjs
          node tools/browser-offline-17052.mjs
          node tools/browser-absence-layout-17061.mjs
          node tools/browser-soft-grid-17066.mjs
          node tools/browser-equal-grid-17067.mjs
      - name: Benchmark PWA three times in independent Chromium profiles
        working-directory: .rak-canonical-build/work
        run: node tools/pwa-start-bench-17068.mjs
      - name: Verify live anonymous HTTP against isolated TEST Supabase
        working-directory: .rak-canonical-build/work
        run: node tools/http-anon-audit-17050.mjs
      - name: Verify isolated output and immutable canonical sources
        run: |
          node --test tools/canonical-build-contract.test.mjs
          test -f .rak-canonical-build/verified.json
          git diff --exit-code HEAD --
      - name: Retain isolated-build reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: rak-17070-isolated-build-${{ github.sha }}
          path: .rak-canonical-build/*.json
          if-no-files-found: error
          retention-days: 30
