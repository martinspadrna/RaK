name: RaK development validation

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rak-development-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact development commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight isolated build policy and measured thirteen-point roadmap
        run: node --test tools/vercel-build-policy.test.mjs tools/development-deploy-gate.test.mjs tools/release-evidence.test.mjs tools/build-architecture-contract.test.mjs tools/production-migration-history.test.mjs tools/roadmap-contract.test.mjs tools/canonical-source-snapshot.test.mjs tools/canonical-build-contract.test.mjs tools/canonical-baseline-smoke.mjs tools/ui-parity-contract.test.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and run npm check and critical smoke twice
        run: |
          npm run vercel-build
          npm run vercel-build
      - name: Verify final release and inherited quality gates
        working-directory: .rak-canonical-build/work
        run: |
          node --test tools/release-gate-17039.test.mjs
          node --test tools/rotation-release-gate-17040.test.mjs
          node --test tools/two-pass-release-17041.test.mjs
          node --test tools/release-gate-17067.test.mjs
          node --test tools/release-gate-17068.test.mjs
          node --test tools/release-gate-17069.test.mjs
          node --test tools/release-gate-17071.test.mjs
          node --test tools/release-gate-17072.test.mjs
          node --test tools/release-gate-17073.test.mjs
          node --test tools/release-gate-17074.test.mjs
          node --test tools/release-gate-17075.test.mjs
          node --test tools/release-gate-17076.test.mjs
          node --test tools/release-gate-17077.test.mjs
          node --test tools/release-gate-17079.test.mjs
          node --test tools/release-gate-17080.test.mjs
          node --test tools/release-gate-17081.test.mjs
          node --test tools/release-gate-17082.test.mjs
          node --test tools/release-gate-17099.test.mjs
          node --test tools/release-gate-17102.test.mjs
          node --test tools/release-gate-17103.test.mjs
          node --test tools/release-gate-17104.test.mjs
          node --test tools/privacy-diagnostics-17105.test.mjs tools/release-gate-17105.test.mjs tools/release-gate-17106.test.mjs tools/release-gate-17107.test.mjs tools/release-gate-17108.test.mjs tools/release-gate-17109.test.mjs tools/release-gate-17110.test.mjs tools/unplanned-absence-17111.test.mjs tools/rejected-operation-diagnostics-17111.test.mjs tools/release-gate-17111.test.mjs tools/unplanned-popup-17112.test.mjs tools/release-gate-17112.test.mjs tools/release-gate-17113.test.mjs tools/release-gate-17114.test.mjs tools/unplanned-reasons-17115.test.mjs tools/release-gate-17115.test.mjs tools/unplanned-kalirna-17116.test.mjs tools/release-gate-17116.test.mjs tools/staffing-shortage-17117.test.mjs tools/release-gate-17117.test.mjs tools/release-gate-17118.test.mjs tools/unplanned-scope-17119.test.mjs tools/release-gate-17119.test.mjs tools/unplanned-local-reflow-17120.test.mjs tools/release-gate-17120.test.mjs tools/unplanned-generator-options-17121.test.mjs tools/release-gate-17121.test.mjs
          node --test tools/regression-parity-contract.test.mjs
          node --test tools/ui-parity-contract.test.mjs
      - name: Verify non-destructive rollback contract and measured PWA budgets
        working-directory: .rak-canonical-build/work
        run: |
          node --check tools/preview-rollback-preflight-17068.mjs
          node --check tools/pwa-start-bench-17068.mjs
          node --test tools/preview-rollback-preflight-17068.test.mjs
          node --test tools/pwa-start-bench-17068.test.mjs tools/performance-budget-17104.test.mjs
      - name: Verify source backup ZIP inventory, excluded files and CRC
        working-directory: .rak-canonical-build/work
        run: node tools/backup-source-integrity-17051.mjs
      - name: Real Chromium mobile offline, slow network and service-worker update recovery
        working-directory: .rak-canonical-build/work
        run: |
          node --test tools/pwa-offline-17052.test.mjs tools/network-resilience-17104.test.mjs
          node tools/browser-offline-17052.mjs
          node tools/browser-absence-layout-17061.mjs
          node tools/browser-soft-grid-17066.mjs
          node tools/browser-equal-grid-17067.mjs
          node tools/browser-fourth-bundle-17097.mjs
          node tools/browser-iphone-regressions-17100.mjs
          node tools/browser-ui-parity-17104.mjs
          node tools/browser-privacy-diagnostics-17105.mjs
      - name: Benchmark PWA three times with fail-closed time and size budgets
        working-directory: .rak-canonical-build/work
        env:
          RAK_CANONICAL_BUILD_PROOF: ${{ github.workspace }}/.rak-canonical-build/verified.json
          RAK_PERFORMANCE_EVIDENCE: ${{ github.workspace }}/.rak-release-evidence/performance-budget.json
        run: |
          node tools/pwa-start-bench-17068.mjs
          test -s "$RAK_PERFORMANCE_EVIDENCE"
      - name: Compare current startup and first paint with immutable 1.7.69
        working-directory: .rak-canonical-build/work
        run: |
          node --test tools/performance-parity-17069.test.mjs
          node tools/performance-parity-17069.mjs
          test -s "${{ github.workspace }}/.rak-canonical-build/performance-parity-17069.json"
      - name: Enforce unified performance, network and conflict quality thresholds
        working-directory: .rak-canonical-build/work
        env:
          RAK_PERFORMANCE_EVIDENCE: ${{ github.workspace }}/.rak-release-evidence/performance-budget.json
          RAK_NETWORK_EVIDENCE: ${{ github.workspace }}/.rak-canonical-build/network-resilience.json
          RAK_PARITY_EVIDENCE: ${{ github.workspace }}/.rak-canonical-build/performance-parity-17069.json
          RAK_QUALITY_EVIDENCE: ${{ github.workspace }}/.rak-release-evidence/quality-thresholds.json
        run: |
          node --test tools/quality-thresholds-17104.test.mjs
          node tools/quality-thresholds-17104.mjs
          test -s "$RAK_QUALITY_EVIDENCE"
      - name: Verify live anonymous HTTP against isolated TEST Supabase
        working-directory: .rak-canonical-build/work
        run: node tools/http-anon-audit-17050.mjs
      - name: Verify isolated output and immutable canonical sources
        run: |
          node --test tools/canonical-build-contract.test.mjs
          test -f .rak-canonical-build/verified.json
          git diff --exit-code HEAD --
      - name: Create fail-closed CI release proof
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node tools/release-evidence.mjs ci-proof
      - name: Retain isolated-build reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: rak-170121-isolated-build-${{ github.sha }}
          path: .rak-canonical-build/*.json
      - name: Retain historical isolated-build evidence alias
        uses: actions/upload-artifact@v4
        with:
          name: rak-170120-isolated-build-${{ github.sha }}
          path: .rak-canonical-build/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain CI proof for the post-success deployment job
        uses: actions/upload-artifact@v4
        with:
          name: rak-ci-proof-${{ github.sha }}
          path: .rak-release-evidence/ci/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  release-preview:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_2 }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_NAME: skoda-spada
      STABLE_ALIAS: skoda-spada-git-development-martinspadrnas-projects.vercel.app
      PRODUCTION_ALIAS: skoda-spada.vercel.app
    steps:
      - name: Check out the exact green SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decide whether this exact green change requires a preview
        id: policy
        run: node tools/release-evidence.mjs policy
      - name: Require the encrypted Vercel credential and exact project identity
        if: steps.policy.outputs.deploy == 'true'
        run: |
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_ORG_ID" = "team_wZkLmDlJZ9WUtm7IUU3i3tg4"
          test "$VERCEL_PROJECT_ID" = "prj_Pv7eNEt5qGg2GX9l365fJnc0YUMF"
      - name: Download proof produced by the successful verify job
        if: steps.policy.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: rak-ci-proof-${{ github.sha }}
          path: .rak-release-evidence/input
      - name: Verify the downloaded CI and two-build proof
        if: steps.policy.outputs.deploy == 'true'
        run: node tools/release-evidence.mjs verify-ci .rak-release-evidence/input/ci-proof.json .rak-release-evidence/input/canonical-build-verified.json "$GITHUB_SHA"
      - name: Install pinned Vercel CLI and pull preview settings
        if: steps.policy.outputs.deploy == 'true'
        run: |
          npm install --global vercel@59.24.0
          vercel pull --yes --environment=preview --git-branch=development --token="$VERCEL_TOKEN"
          node -e "const p=require('./.vercel/project.json');if(p.orgId!==process.env.VERCEL_ORG_ID||p.projectId!==process.env.VERCEL_PROJECT_ID)throw Error('Vercel project identity mismatch')"
      - name: Snapshot immutable refs, rollback target and production deployment
        if: steps.policy.outputs.deploy == 'true'
        run: |
          mkdir -p .rak-release-evidence
          development_sha="$(gh api repos/${{ github.repository }}/git/ref/heads/development --jq .object.sha)"
          main_sha="$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)"
          test "$development_sha" = "$GITHUB_SHA"
          jq -n --arg development "$development_sha" --arg main "$main_sha" '{development:$development,main:$main}' > .rak-release-evidence/refs-before.json
          vercel api "/v13/deployments/$STABLE_ALIAS" --raw --token="$VERCEL_TOKEN" > .rak-release-evidence/rollback-target.json
          vercel api "/v13/deployments/$PRODUCTION_ALIAS" --raw --token="$VERCEL_TOKEN" > .rak-release-evidence/production-before.json
      - name: Build exact SHA as a preview without touching production
        if: steps.policy.outputs.deploy == 'true'
        run: |
          vercel build --yes --target=preview --token="$VERCEL_TOKEN"
          test -s ".rak-dist/supabase-vendor-2.110.7.js"
          test -s ".rak-dist/rak-complete-backup-source.zip"
          test "$(wc -c < .rak-dist/rak-complete-backup-source.zip)" -gt 100000
          unzip -tqq ".rak-dist/rak-complete-backup-source.zip"
          mkdir -p ".vercel/output/static"
          cp -a ".rak-dist/." ".vercel/output/static/"
          test -s ".vercel/output/static/supabase-vendor-2.110.7.js"
          test -s ".vercel/output/static/rak-complete-backup-source.zip"
          cmp ".rak-dist/rak-complete-backup-source.zip" ".vercel/output/static/rak-complete-backup-source.zip"
          unzip -tqq ".vercel/output/static/rak-complete-backup-source.zip"
      - name: Deploy prebuilt exact SHA only after the green verify job
        if: steps.policy.outputs.deploy == 'true'
        run: |
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/development --jq .object.sha)" = "$GITHUB_SHA"
          vercel deploy --prebuilt --yes --target=preview --json --token="$VERCEL_TOKEN"             --meta githubCommitSha="$GITHUB_SHA" --meta githubCommitRef=development             --meta githubRepo=RaK --meta githubOrg=martinspadrna > .rak-release-evidence/deploy-result.json
          deployment_id="$(jq -r '.id // .deployment.id // empty' .rak-release-evidence/deploy-result.json)"
          test -n "$deployment_id"
          echo "DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
          vercel api "/v13/deployments/$deployment_id" --raw --token="$VERCEL_TOKEN" > .rak-release-evidence/deployment.json
      - name: Verify immutable deployment HTTP, release metadata and TEST isolation
        if: steps.policy.outputs.deploy == 'true'
        run: |
          mkdir -p .rak-release-evidence/http/immutable
          vercel curl / --deployment "$DEPLOYMENT_ID" -- --fail --silent --show-error --dump-header .rak-release-evidence/http/immutable/index.headers --output .rak-release-evidence/http/immutable/index.body
          vercel curl /sw.js --deployment "$DEPLOYMENT_ID" -- --fail --silent --show-error --dump-header .rak-release-evidence/http/immutable/sw.headers --output .rak-release-evidence/http/immutable/sw.body
          vercel curl /rak-release-metadata.js --deployment "$DEPLOYMENT_ID" -- --fail --silent --show-error --dump-header .rak-release-evidence/http/immutable/metadata.headers --output .rak-release-evidence/http/immutable/metadata.body
          vercel curl /supabase-config.js --deployment "$DEPLOYMENT_ID" -- --fail --silent --show-error --dump-header .rak-release-evidence/http/immutable/supabase.headers --output .rak-release-evidence/http/immutable/supabase.body
          vercel curl /rak-complete-backup-source.zip --deployment "$DEPLOYMENT_ID" -- --fail --silent --show-error --dump-header .rak-release-evidence/http/immutable/source-zip.headers --output .rak-release-evidence/http/immutable/source-zip.body
          test "$(wc -c < .rak-release-evidence/http/immutable/source-zip.body)" -gt 100000
          unzip -tqq .rak-release-evidence/http/immutable/source-zip.body
          node tools/release-evidence.mjs http-check immutable .rak-release-evidence/http/immutable .rak-release-evidence/http-immutable.json
      - name: Move only the stable development alias after immutable verification
        if: steps.policy.outputs.deploy == 'true'
        run: |
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/development --jq .object.sha)" = "$GITHUB_SHA"
          vercel alias set "$DEPLOYMENT_ID" "$STABLE_ALIAS" --token="$VERCEL_TOKEN"
          vercel api "/v13/deployments/$STABLE_ALIAS" --raw --token="$VERCEL_TOKEN" > .rak-release-evidence/alias-after.json
      - name: Expose only the stable development alias without disabling project protection
        if: steps.policy.outputs.deploy == 'true'
        run: |
          node <<'NODE'
          const token=process.env.VERCEL_TOKEN;
          const teamId=process.env.VERCEL_ORG_ID;
          const alias=process.env.STABLE_ALIAS;
          if(!token||!teamId||!alias) throw new Error('Missing Vercel alias-protection inputs');
          const auth={Authorization:'Bearer '+token};
          const aliasResponse=await fetch('https://api.vercel.com/v4/aliases/'+encodeURIComponent(alias)+'?teamId='+encodeURIComponent(teamId),{headers:auth});
          if(!aliasResponse.ok) throw new Error('Alias lookup failed with HTTP '+aliasResponse.status);
          const aliasJson=await aliasResponse.json();
          const aliasId=String(aliasJson.id||aliasJson.uid||'').trim();
          if(!aliasId) throw new Error('Alias lookup returned no id');
          const patchResponse=await fetch('https://api.vercel.com/aliases/'+encodeURIComponent(aliasId)+'/protection-bypass?teamId='+encodeURIComponent(teamId),{
            method:'PATCH',
            headers:{...auth,'content-type':'application/json'},
            body:JSON.stringify({override:{scope:'alias-protection-override',action:'create'}})
          });
          if(!patchResponse.ok && patchResponse.status!==400) throw new Error('Alias protection override failed with HTTP '+patchResponse.status);
          if(patchResponse.ok) console.log('[release] stable development alias protection override active');
          else console.log('[release] alias override already active or not recreated; anonymous HTTP verification decides');
          NODE
      - name: Verify the stable development alias is publicly usable without Vercel auth
        if: steps.policy.outputs.deploy == 'true'
        run: |
          mkdir -p .rak-release-evidence/http/stable
          fetch_public() {
            path="$1"
            name="$2"
            code=""
            for attempt in $(seq 1 12); do
              code="$(curl --silent --show-error --max-redirs 0 --dump-header ".rak-release-evidence/http/stable/$name.headers" --output ".rak-release-evidence/http/stable/$name.body" --write-out '%{http_code}' "https://$STABLE_ALIAS$path")"
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 2
            done
            echo "Public development asset $path returned HTTP $code instead of 200" >&2
            return 1
          }
          fetch_public "/" "index"
          fetch_public "/sw.js" "sw"
          fetch_public "/rak-release-metadata.js" "metadata"
          fetch_public "/supabase-config.js" "supabase"
          DISPLAY_VERSION="$(node --input-type=module -e "import metadata from './rak-release-metadata.js'; process.stdout.write(metadata.displayVersion)")"
          fetch_public "/app.js?v=$DISPLAY_VERSION" "app"
          fetch_public "/supabase-vendor-2.110.7.js" "vendor"
          fetch_public "/rak-complete-backup-source.zip?v=$DISPLAY_VERSION" "source-zip"
          test -s .rak-release-evidence/http/stable/app.body
          test -s .rak-release-evidence/http/stable/vendor.body
          test "$(wc -c < .rak-release-evidence/http/stable/source-zip.body)" -gt 100000
          unzip -tqq .rak-release-evidence/http/stable/source-zip.body
          node tools/release-evidence.mjs http-check stable-alias .rak-release-evidence/http/stable .rak-release-evidence/http-stable-alias.json
      - name: Prove main and production remained unchanged and assemble release evidence
        if: steps.policy.outputs.deploy == 'true'
        run: |
          development_sha="$(gh api repos/${{ github.repository }}/git/ref/heads/development --jq .object.sha)"
          main_sha="$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)"
          jq -n --arg development "$development_sha" --arg main "$main_sha" '{development:$development,main:$main}' > .rak-release-evidence/refs-after.json
          vercel api "/v13/deployments/$PRODUCTION_ALIAS" --raw --token="$VERCEL_TOKEN" > .rak-release-evidence/production-after.json
          node tools/release-evidence.mjs assemble
      - name: Retain release evidence bound to the exact SHA
        if: steps.policy.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rak-release-evidence-${{ github.sha }}
          path: |
            .rak-release-evidence/release-evidence.json
            .rak-release-evidence/policy.json
            .rak-release-evidence/http-immutable.json
            .rak-release-evidence/http-stable-alias.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Report verified documentation-only skip
        if: steps.policy.outputs.deploy != 'true'
        run: echo "No Vercel deployment required; fail-closed policy result was ${{ steps.policy.outputs.reason }}."
