name: RaK development validation

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rak-development-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact development commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and run existing npm check and critical smoke twice
        run: |
          npm run vercel-build
          npm run vercel-build
      - name: Verify final second-pass release and inherited quality gates
        run: |
          node --test tools/release-gate-17039.test.mjs
          node --test tools/rotation-release-gate-17040.test.mjs
          node --test tools/two-pass-release-17041.test.mjs
          node --test tools/release-gate-17043.test.mjs
          node --test tools/release-gate-17044.test.mjs
