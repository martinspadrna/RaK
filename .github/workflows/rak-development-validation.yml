name: RaK development validation

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rak-development-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact development commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and run existing npm check and critical smoke
        run: npm run vercel-build
      - name: Check final release gate after build
        run: node --test tools/release-gate-17039.test.mjs
