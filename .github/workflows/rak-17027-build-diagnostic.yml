name: RaK 1.7.27 build diagnostic
on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-17027-build-diagnostic.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Reproduce Vercel build with exact error output
        run: npm run vercel-build
