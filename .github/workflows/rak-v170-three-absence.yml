name: RaK 1.7 persist three-absence generator and regression

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/rak-v170-three-absence.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Materialize previously build-only fixes and add guards
        shell: bash
        run: |
          set -euo pipefail
          node tools/release-170.mjs pre
          node tools/defer-heavy-libs.mjs
          node tools/generator-staffing-170.mjs
          node tools/generator-grinder-tasks-170.mjs
          python3 tools/rak-v170-three-absence.py
          node --check admin-rotation-generator.js
          node --check admin-rotation.js
          node --check rotation-tasks.js
          node --check tools/rak-v170-three-absence-regression.mjs
          node tools/rak-v170-three-absence-regression.mjs
      - name: Full build, repository check and critical runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run vercel-build
          node tools/rak-v170-three-absence-regression.mjs
          node tools/critical-runtime-smoke.mjs
      - name: Commit source code and tests on development only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rak-v170-three-absence.yml tools/rak-v170-three-absence.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-rotation-generator.js admin-rotation.js rotation-tasks.js tools/generator-finalize-170.mjs tools/generator-staffing-170-smoke.mjs tools/shift-report-mo-hotfix-170-smoke.mjs tools/rak-v170-three-absence-regression.mjs
          git add -u .github/workflows/rak-v170-three-absence.yml tools/rak-v170-three-absence.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'RaK 1.7 persist three-absence 4+3 staffing, task handoff and regression'
          git push origin HEAD:development
